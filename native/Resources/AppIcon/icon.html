<!doctype html>
<!-- Source of AppIcon-1024.png: ink-wash mountains in three tones with a red sun. See README.md. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="14"/>
  </filter>
  <filter id="roughFine" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="7"/>
  </filter>
</svg>
<canvas id="out" width="1024" height="1024"></canvas>
<script>
const S = 1024
const INK = [22, 19, 15]
const SUN = '#C3352B'

function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed)
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
    return ((t ^ t >>> 14) >>> 0) / 4294967296
  }
}
function layer() {
  const c = document.createElement('canvas'); c.width = c.height = S
  return [c, c.getContext('2d')]
}
// Smooth 1D value noise; each ridge reads its own lane.
function noise(lane, x) {
  const h = n => { const s = Math.sin(n * 127.1 + lane * 311.7) * 43758.5453; return s - Math.floor(s) }
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f)
  return h(i) * (1 - u) + h(i + 1) * u
}
// Rice paper: warm white with scattered fibers.
function paper(ctx) {
  const g = ctx.createRadialGradient(430, 380, 80, 512, 512, 700)
  g.addColorStop(0, '#FBF7EE'); g.addColorStop(1, '#ECE4D3')
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S)
  const r = rng(11)
  for (let i = 0; i < 1400; i++) {
    const x = r() * S, y = r() * S, a = r() * 7, l = 6 + r() * 26
    ctx.strokeStyle = r() < 0.5 ? `rgba(255,255,255,${0.25 + r() * 0.3})` : `rgba(120,100,70,${0.04 + r() * 0.07})`
    ctx.lineWidth = 0.6 + r(); ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (r() - 0.5) * 8, y + Math.sin(a) * l * 0.5 + (r() - 0.5) * 8, x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke()
  }
}
// The macOS icon plate: an 824 px superellipse centered on the 1024 px canvas.
function squircle(ctx) {
  const c = 512, h = 412, n = 5
  ctx.beginPath()
  for (let i = 0; i <= 360; i++) {
    const a = i / 360 * Math.PI * 2, cs = Math.cos(a), sn = Math.sin(a)
    const x = c + h * Math.sign(cs) * Math.abs(cs) ** (2 / n), y = c + h * Math.sign(sn) * Math.abs(sn) ** (2 / n)
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
  }
  ctx.closePath()
}

const [art, actx] = layer(); paper(actx)
const [ink, ictx] = layer()

// One mountain ridge: peaks are [center x, width, height]; the ink fades into mist below.
function ridge(base, peaks, tone, lane) {
  const y = x => base - peaks.reduce((m, [cx, w, h]) => m + h * Math.exp(-(((x - cx) / w) ** 2)), 0) - noise(lane, x / 34) * 22 - noise(lane + 9, x / 9) * 7
  const g = ictx.createLinearGradient(0, base - 300, 0, base + 150)
  g.addColorStop(0, `rgba(${INK},${tone})`); g.addColorStop(0.45, `rgba(${INK},${tone * 0.8})`); g.addColorStop(1, `rgba(${INK},0)`)
  ictx.fillStyle = g; ictx.beginPath(); ictx.moveTo(40, base + 160)
  for (let x = 40; x <= 984; x += 4) ictx.lineTo(x, y(x))
  ictx.lineTo(984, base + 160); ictx.fill()
}
actx.fillStyle = SUN; actx.beginPath(); actx.arc(668, 318, 74, 0, 7); actx.fill()
ridge(560, [[330, 150, 190], [640, 190, 120], [900, 120, 150]], 0.2, 1)
ridge(680, [[220, 130, 120], [560, 150, 230], [860, 140, 90]], 0.48, 2)
ridge(820, [[250, 170, 210], [700, 200, 110]], 0.97, 3)

actx.save(); actx.filter = 'url(#roughFine) blur(0.5px)'; actx.drawImage(ink, 0, 0); actx.restore()
// Wet edge bleed around the ink.
actx.save(); actx.globalAlpha = 0.22; actx.filter = 'url(#rough) blur(7px)'; actx.drawImage(ink, 0, 0); actx.restore()

const out = document.getElementById('out').getContext('2d')
out.save(); out.shadowColor = 'rgba(0,0,0,0.30)'; out.shadowBlur = 28; out.shadowOffsetY = 10; out.fillStyle = '#ECE4D3'; squircle(out); out.fill(); out.restore()
out.save(); squircle(out); out.clip(); out.drawImage(art, 0, 0)
out.lineWidth = 6; out.strokeStyle = 'rgba(255,255,255,0.55)'; squircle(out); out.stroke()
out.lineWidth = 2; out.strokeStyle = 'rgba(70,55,35,0.25)'; squircle(out); out.stroke(); out.restore()
</script>
